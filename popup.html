<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      margin: 0;
      background-color: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #3ea6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #272727;
    }
    .phrases-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      cursor: pointer;
      accent-color: #3ea6ff;
    }
    .hint {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>Windify</h2>

  <div class="toggle-row">
    <span>Лица Винди на превью</span>
    <input type="checkbox" id="toggle-faces" checked>
  </div>

  <div class="toggle-row">
    <span>Приписки к названиям</span>
    <input type="checkbox" id="toggle-titles" checked>
  </div>

  <div class="hint">Выберите фразы для приписки:</div>
  <div class="phrases-list" id="phrases-container">
    <label><input type="checkbox" class="phrase-check" value="(и это правда страшно...)" checked> (и это правда страшно...)</label>
    <label><input type="checkbox" class="phrase-check" value="(и это забавно...)"> (и это забавно...)</label>
    <label><input type="checkbox" class="phrase-check" value="(да, реально всё...)"> (да, реально всё...)</label>
    <label><input type="checkbox" class="phrase-check" value="(я не усну...)"> (я не усну...)</label>
    <label><input type="checkbox" class="phrase-check" value="(тебе конец...)"> (тебе конец...)</label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
